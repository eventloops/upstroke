# Every `libc::` item this tree names, classified.
#
# `claim_scope` makes exhaustiveness "the disallowed list is complete for the
# **primitives the crate uses**", so this list is derived from the tree, not
# transcribed from the sentence's `fork/kill/setpgid/setsid/flock/fcntl/exec*` --
# which is six names out of the two dozen effect primitives this crate calls.
#
# An item is an EFFECT when calling it changes state outside the calling
# thread's own memory: the filesystem, the process/signal table, a descriptor,
# a lock, or a resource limit. Constants (`SIG*`, `O_*`, `F_*`, `LOCK_*`, `E*`),
# types (`pid_t`, `pollfd`, `sigset_t`) and read-only queries (`getpid`,
# `sysconf`, `poll`, `read`, `proc_pidinfo`) are not.
[libc]
# `setsid` and the `exec*` family are in this list and appear nowhere in the
# tree: `mechanism` (1) names them regardless ("libc fork/kill/setpgid/setsid/
# flock/fcntl/exec*"), and a denial of a primitive the crate does not yet call is
# the cheapest kind there is. `every_platform_conditional_denial_names_something_
# real` carries them in its PACKET_ONLY set for the same reason.
effect = [
    "_exit",
    "close",
    # Rewrites the descriptor table of the process that calls it. The Unix
    # reaper's container half puts its listing pipe on fd 1 with it, in the
    # forked child before `execv`.
    "dup2",
    "execl",
    "execle",
