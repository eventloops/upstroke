name: Pull request policy

on:
  pull_request:
    branches: [master]
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-policy-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  policy:
    name: tactus-pr-policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate title and evidence sections
        shell: bash
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          title_pattern='^(feat|fix|docs|refactor|test|chore|ci|build|perf|security|release|revert)(\([a-z0-9][a-z0-9._/-]*\))?!?: .+'
          if [[ ! "$PR_TITLE" =~ $title_pattern ]]; then
            echo "Pull-request title must use: type(optional-scope): summary" >&2
            echo "Allowed types: feat, fix, docs, refactor, test, chore, ci, build, perf, security, release, revert" >&2
            exit 1
          fi

          failed=0
          pr_body="${PR_BODY//$'\r'/}"
          required_sections=(
            "## Summary"
            "## Scope"
            "## Validation"
            "## Review evidence"
            "## Risk and rollback"
          )
          for section in "${required_sections[@]}"; do
            if ! grep -Fqx "$section" <<< "$pr_body"; then
              echo "Pull-request body is missing: $section" >&2
              failed=1
            fi
          done
          exit "$failed"
