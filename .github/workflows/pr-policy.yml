name: Pull request policy

on:
  # This pull_request workflow and its checked-out validator are candidate
  # controlled. It is fast feedback only; the default-branch frontier-review
  # workflow re-runs the canonical validator before the App check is minted.
  pull_request:
    branches: [master]
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-policy-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  policy:
    name: tactus-pr-policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate title, evidence sections, and finding ledger
        shell: bash
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s\n' "$PR_BODY" | bash .github/scripts/validate-pr-body.sh "$PR_TITLE"
          printf '%s\n' "$PR_BODY" | bash .github/scripts/validate-pr-ledger-evidence.sh \
            "${{ github.event.pull_request.head.sha }}"
