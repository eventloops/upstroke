name: Record frontier review attestation

on:
  # Unlike workflow_dispatch, repository_dispatch cannot select a feature-branch
  # copy of this privileged workflow. GitHub always executes the version on the
  # default branch.
  repository_dispatch:
    types: [frontier-review]

permissions:
  checks: write
  contents: read
  pull-requests: read

jobs:
  attest:
    name: attest frontier review
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      DISPATCH_ACTOR: ${{ github.actor }}
      PR_NUMBER: ${{ github.event.client_payload.pull_request }}
      REVIEWED_SHA: ${{ github.event.client_payload.reviewed_sha }}
      REVIEW_URL: ${{ github.event.client_payload.review_url }}
    steps:
      - name: Verify review preconditions and attest exact head
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "pull_request must be a positive integer" >&2
            exit 1
          fi
          if [[ ! "$REVIEWED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "reviewed_sha must be a full lowercase commit SHA" >&2
            exit 1
          fi
          review_prefix="https://github.com/$GITHUB_REPOSITORY/pull/$PR_NUMBER"
          if [[ "$REVIEW_URL" != "$review_prefix#"* && "$REVIEW_URL" != "$review_prefix/files#"* ]]; then
            echo "review_url must point to anchored evidence on this pull request" >&2
            exit 1
          fi

          repository="$(gh api "repos/$GITHUB_REPOSITORY")"
          repository_owner="$(jq -r '.owner.login' <<< "$repository")"
          default_branch="$(jq -r '.default_branch' <<< "$repository")"
          if [[ "${DISPATCH_ACTOR,,}" != "${repository_owner,,}" ]]; then
            echo "only repository owner $repository_owner may attest a frontier review" >&2
            exit 1
          fi

          pr="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")"
          state="$(jq -r '.state' <<< "$pr")"
          head_sha="$(jq -r '.head.sha' <<< "$pr")"
          base_ref="$(jq -r '.base.ref' <<< "$pr")"

          if [[ "$state" != "open" ]]; then
            echo "pull request #$PR_NUMBER is not open" >&2
            exit 1
          fi
          if [[ "$head_sha" != "$REVIEWED_SHA" ]]; then
            echo "reviewed SHA $REVIEWED_SHA is not current head $head_sha" >&2
            exit 1
          fi
          if [[ "$base_ref" != "$default_branch" ]]; then
            echo "pull request targets $base_ref, not default branch $default_branch" >&2
            exit 1
          fi

          behind_by="$(gh api \
            "repos/$GITHUB_REPOSITORY/compare/$default_branch...$head_sha" \
            --jq '.behind_by')"
          if [[ "$behind_by" != "0" ]]; then
            echo "pull request head is $behind_by commit(s) behind its base" >&2
            exit 1
          fi

          for required_check in tactus-ci tactus-pr-policy; do
            checks="$(gh api -H 'Accept: application/vnd.github+json' \
              "repos/$GITHUB_REPOSITORY/commits/$head_sha/check-runs?check_name=$required_check&filter=latest&per_page=100")"
            conclusion="$(jq -r --arg name "$required_check" \
              '[.check_runs[] | select(.name == $name and .app.id == 15368)] | max_by(.id) | .conclusion // "missing"' \
              <<< "$checks")"
            if [[ "$conclusion" != "success" ]]; then
              echo "latest GitHub Actions $required_check conclusion is $conclusion on $head_sha" >&2
              exit 1
            fi
          done

          # A check run, rather than a legacy status, lets the ruleset bind the
          # required context to the GitHub Actions app. A maintainer PAT cannot
          # forge that app identity by posting a same-named status directly.
          # All repository workflows share that app identity, however; the
          # documented solo-owner trust model is therefore still authoritative.
          gh api --method POST "repos/$GITHUB_REPOSITORY/check-runs" \
            -H 'Accept: application/vnd.github+json' \
            -f name=frontier-review \
            -f head_sha="$head_sha" \
            -f status=completed \
            -f conclusion=success \
            -f details_url="$REVIEW_URL" \
            -f 'output[title]=Independent frontier review passed' \
            -f "output[summary]=Reviewed exact head $head_sha after current mechanical gates passed. Evidence: $REVIEW_URL"
