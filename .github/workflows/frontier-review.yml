name: Record frontier review attestation

on:
  # repository_dispatch always executes this privileged workflow from the
  # default branch. A pull request cannot replace its validation or jobs.
  repository_dispatch:
    types: [frontier-review]

concurrency:
  group: frontier-review-${{ github.event.client_payload.pull_request }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  validate:
    name: validate attestation request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      head_repository: ${{ steps.validate.outputs.head_repository }}
      head_sha: ${{ steps.validate.outputs.head_sha }}
      reviewed_sha: ${{ steps.validate.outputs.reviewed_sha }}
      review_url: ${{ steps.validate.outputs.review_url }}
      evidence_digest: ${{ steps.validate.outputs.evidence_digest }}
    env:
      GH_TOKEN: ${{ github.token }}
      DISPATCH_ACTOR: ${{ github.actor }}
      PR_NUMBER: ${{ github.event.client_payload.pull_request }}
      REVIEWED_SHA: ${{ github.event.client_payload.reviewed_sha }}
      REVIEW_URL: ${{ github.event.client_payload.review_url }}
    steps:
      # repository_dispatch fixes github.sha to the trusted default-branch
      # commit whose workflow is running. Never check out the PR head here.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate owner, pull request, evidence, and exact head
        id: validate
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "pull_request must be a positive integer" >&2
            exit 1
          fi
          if [[ ! "$REVIEWED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "reviewed_sha must be a full lowercase commit SHA" >&2
            exit 1
          fi
          review_prefix="https://github.com/$GITHUB_REPOSITORY/pull/$PR_NUMBER#issuecomment-"
          review_comment_id="${REVIEW_URL#"$review_prefix"}"
          if [[ "$REVIEW_URL" == "$review_comment_id" || ! "$review_comment_id" =~ ^[1-9][0-9]*$ ]]; then
            echo "review_url must identify a PR review-evidence comment" >&2
            exit 1
          fi

          repository="$(gh api "repos/$GITHUB_REPOSITORY")"
          repository_owner="$(jq -r '.owner.login' <<< "$repository")"
          default_branch="$(jq -r '.default_branch' <<< "$repository")"
          if [[ "${DISPATCH_ACTOR,,}" != "${repository_owner,,}" ]]; then
            echo "only repository owner $repository_owner may attest a frontier review" >&2
            exit 1
          fi

          pr="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")"
          state="$(jq -r '.state' <<< "$pr")"
          head_sha="$(jq -r '.head.sha' <<< "$pr")"
          head_repository="$(jq -r '.head.repo.full_name' <<< "$pr")"
          base_ref="$(jq -r '.base.ref' <<< "$pr")"
          pr_title="$(jq -r '.title' <<< "$pr")"
          pr_body="$(jq -r '.body // ""' <<< "$pr" | tr -d '\r')"

          if [[ "$state" != "open" ]]; then
            echo "pull request #$PR_NUMBER is not open" >&2
            exit 1
          fi
          # A reviewed SHA that is no longer the current head is judged below,
          # after this job has fetched the exact PR history itself: it may
          # carry to the head only when it is an ancestor and every changed
          # path is exempt (exactly reviews/FINDINGS.md).
          # decisions/2026-08-20-review-invalidation-scope.md
          if [[ "$base_ref" != "$default_branch" ]]; then
            echo "pull request targets $base_ref, not default branch $default_branch" >&2
            exit 1
          fi
          if [[ "$head_repository" == "null" ]]; then
            echo "pull request head repository is unavailable" >&2
            exit 1
          fi

          behind_by="$(gh api \
            "repos/$GITHUB_REPOSITORY/compare/$default_branch...$head_sha" \
            --jq '.behind_by')"
          if [[ "$behind_by" != "0" ]]; then
            echo "pull request head is $behind_by commit(s) behind its base" >&2
            exit 1
          fi

          # This checkout and validator come from the trusted default branch,
          # never from the pull request whose metadata is being attested.
          printf '%s\n' "$pr_body" | bash .github/scripts/validate-pr-body.sh "$pr_title"
          if [[ "$(git rev-parse --is-shallow-repository)" == "true" ]]; then
            git -c core.hooksPath=/dev/null -c core.fsmonitor=false \
              fetch --no-tags --unshallow origin
          fi
          ledger_ref="refs/tactus/ledger/$head_sha"
          git -c core.hooksPath=/dev/null -c core.fsmonitor=false \
            fetch --no-tags --force origin \
            "refs/pull/$PR_NUMBER/head:$ledger_ref"
          if [[ "$(git rev-parse "$ledger_ref^{commit}")" != "$head_sha" ]]; then
            echo "fetched pull-request ref does not match the API head" >&2
            exit 1
          fi
          if [[ "$head_sha" != "$REVIEWED_SHA" ]]; then
            # Exempt-path re-attestation: a review of an earlier head carries
            # to this one only when the reviewed SHA is an ancestor and the
            # entire diff lies inside the exempt set. Computed here from refs
            # this trusted job fetched itself, never asserted by the requester.
            # decisions/2026-08-20-review-invalidation-scope.md
            if ! git cat-file -e "$REVIEWED_SHA^{commit}" 2>/dev/null; then
              echo "reviewed SHA $REVIEWED_SHA is not in the fetched pull-request history" >&2
              exit 1
            fi
            if ! git merge-base --is-ancestor "$REVIEWED_SHA" "$head_sha"; then
              echo "reviewed SHA $REVIEWED_SHA is not an ancestor of head $head_sha" >&2
              exit 1
            fi
            while IFS= read -r drift_path; do
              [[ -z "$drift_path" ]] && continue
              if [[ "$drift_path" != "reviews/FINDINGS.md" ]]; then
                echo "path '$drift_path' changed since the review and is outside the exempt set; a fresh review of $head_sha is required" >&2
                exit 1
              fi
            done < <(git diff --name-only "$REVIEWED_SHA..$head_sha")
          fi
          printf '%s\n' "$pr_body" | bash .github/scripts/validate-pr-ledger-evidence.sh "$head_sha"

          review_comment="$(gh api "repos/$GITHUB_REPOSITORY/issues/comments/$review_comment_id")"
          comment_url="$(jq -r '.html_url' <<< "$review_comment")"
          comment_author="$(jq -r '.user.login' <<< "$review_comment")"
          comment_issue="$(jq -r '.issue_url' <<< "$review_comment")"
          comment_body="$(jq -r '.body // ""' <<< "$review_comment" | tr -d '\r')"
          if [[ "$comment_url" != "$REVIEW_URL" || "$comment_issue" != "https://api.github.com/repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER" ]]; then
            echo "review evidence is not a comment on pull request #$PR_NUMBER" >&2
            exit 1
          fi
          if [[ "${comment_author,,}" != "${repository_owner,,}" ]]; then
            echo "review evidence must be recorded by repository owner $repository_owner" >&2
            exit 1
          fi
          printf '%s' "$comment_body" | bash .github/scripts/validate-frontier-evidence.sh "$REVIEWED_SHA"
          evidence_digest="$(printf '%s' "$comment_body" | sha256sum | awk '{print $1}')"

          {
            echo "head_repository=$head_repository"
            echo "head_sha=$head_sha"
            echo "reviewed_sha=$REVIEWED_SHA"
            echo "review_url=$REVIEW_URL"
            echo "evidence_digest=$evidence_digest"
          } >> "$GITHUB_OUTPUT"

  lint:
    name: trusted lint rerun
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ needs.validate.outputs.head_repository }}
          ref: ${{ needs.validate.outputs.head_sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: bash .github/scripts/test-frontier-evidence.sh
      - run: bash .github/scripts/test-frontier-check.sh
      - run: bash .github/scripts/test-frontier-invalidation.sh
      - run: bash .github/scripts/test-frontier-workflow.sh
      - run: bash .github/scripts/test-release-record.sh
      - run: bash .github/scripts/test-pr-ledger-evidence.sh

  test:
    name: trusted test rerun (${{ matrix.os }})
    needs: validate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ needs.validate.outputs.head_repository }}
          ref: ${{ needs.validate.outputs.head_sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
      - name: Configure git identity
        run: |
          git config --global user.email "ci@tactus.local"
          git config --global user.name "tactus attestation"
      - run: cargo test --all-targets

  attest:
    name: publish App-owned exact-head check
    needs: [validate, lint, test]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: frontier-check-signer
    permissions:
      contents: read
      issues: read
      pull-requests: read
    env:
      PR_NUMBER: ${{ github.event.client_payload.pull_request }}
      REVIEWED_SHA: ${{ needs.validate.outputs.reviewed_sha }}
      ATTESTED_SHA: ${{ needs.validate.outputs.head_sha }}
      REVIEW_URL: ${{ needs.validate.outputs.review_url }}
      EVIDENCE_DIGEST: ${{ needs.validate.outputs.evidence_digest }}
    steps:
      # Keep every script in this privileged job on the trusted default branch.
      # The PR head was tested by the preceding jobs but is never executed here.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Revalidate exact head immediately before signing
        id: live-metadata
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # The trusted test reruns can take 30 minutes. Refuse to sign an
          # obsolete review if the PR moved, closed, or fell behind meanwhile.
          # A push racing the final API call is still safe: the App check is
          # attached to ATTESTED_SHA, the exact head being signed, not to an
          # abstract pull request.
          repository="$(gh api "repos/$GITHUB_REPOSITORY")"
          repository_owner="$(jq -r '.owner.login' <<< "$repository")"
          default_branch="$(jq -r '.default_branch' <<< "$repository")"
          pr="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")"
          state="$(jq -r '.state' <<< "$pr")"
          head_sha="$(jq -r '.head.sha' <<< "$pr")"
          base_ref="$(jq -r '.base.ref' <<< "$pr")"
          pr_title="$(jq -r '.title' <<< "$pr")"
          pr_body="$(jq -r '.body // ""' <<< "$pr" | tr -d '\r')"

          if [[ "$state" != "open" || "$head_sha" != "$ATTESTED_SHA" || "$base_ref" != "$default_branch" ]]; then
            echo "pull request no longer has the validated open head and base" >&2
            exit 1
          fi
          behind_by="$(gh api \
            "repos/$GITHUB_REPOSITORY/compare/$default_branch...$head_sha" \
            --jq '.behind_by')"
          if [[ "$behind_by" != "0" ]]; then
            echo "pull request head became $behind_by commit(s) behind its base" >&2
            exit 1
          fi

          # Re-run the same trusted policy after the test matrix: title, body,
          # and ledger are mutable PR metadata and may have changed meanwhile.
          printf '%s\n' "$pr_body" | bash .github/scripts/validate-pr-body.sh "$pr_title"
          if [[ "$(git rev-parse --is-shallow-repository)" == "true" ]]; then
            git -c core.hooksPath=/dev/null -c core.fsmonitor=false \
              fetch --no-tags --unshallow origin
          fi
          ledger_ref="refs/tactus/ledger/$head_sha"
          git -c core.hooksPath=/dev/null -c core.fsmonitor=false \
            fetch --no-tags --force origin \
            "refs/pull/$PR_NUMBER/head:$ledger_ref"
          if [[ "$(git rev-parse "$ledger_ref^{commit}")" != "$head_sha" ]]; then
            echo "fetched pull-request ref does not match the API head" >&2
            exit 1
          fi
          if [[ "$head_sha" != "$REVIEWED_SHA" ]]; then
            # Exempt-path re-attestation: a review of an earlier head carries
            # to this one only when the reviewed SHA is an ancestor and the
            # entire diff lies inside the exempt set. Computed here from refs
            # this trusted job fetched itself, never asserted by the requester.
            # decisions/2026-08-20-review-invalidation-scope.md
            if ! git cat-file -e "$REVIEWED_SHA^{commit}" 2>/dev/null; then
              echo "reviewed SHA $REVIEWED_SHA is not in the fetched pull-request history" >&2
              exit 1
            fi
            if ! git merge-base --is-ancestor "$REVIEWED_SHA" "$head_sha"; then
              echo "reviewed SHA $REVIEWED_SHA is not an ancestor of head $head_sha" >&2
              exit 1
            fi
            while IFS= read -r drift_path; do
              [[ -z "$drift_path" ]] && continue
              if [[ "$drift_path" != "reviews/FINDINGS.md" ]]; then
                echo "path '$drift_path' changed since the review and is outside the exempt set; a fresh review of $head_sha is required" >&2
                exit 1
              fi
            done < <(git diff --name-only "$REVIEWED_SHA..$head_sha")
          fi
          printf '%s\n' "$pr_body" | bash .github/scripts/validate-pr-ledger-evidence.sh "$head_sha"

          review_prefix="https://github.com/$GITHUB_REPOSITORY/pull/$PR_NUMBER#issuecomment-"
          review_comment_id="${REVIEW_URL#"$review_prefix"}"
          if [[ "$REVIEW_URL" == "$review_comment_id" || ! "$review_comment_id" =~ ^[1-9][0-9]*$ ]]; then
            echo "review_url no longer identifies valid evidence" >&2
            exit 1
          fi
          review_comment="$(gh api "repos/$GITHUB_REPOSITORY/issues/comments/$review_comment_id")"
          comment_url="$(jq -r '.html_url' <<< "$review_comment")"
          comment_author="$(jq -r '.user.login' <<< "$review_comment")"
          comment_issue="$(jq -r '.issue_url' <<< "$review_comment")"
          comment_body="$(jq -r '.body // ""' <<< "$review_comment" | tr -d '\r')"
          if [[ "$comment_url" != "$REVIEW_URL" || "$comment_issue" != "https://api.github.com/repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER" || "${comment_author,,}" != "${repository_owner,,}" ]]; then
            echo "review evidence no longer matches this owner and pull request" >&2
            exit 1
          fi
          printf '%s' "$comment_body" | bash .github/scripts/validate-frontier-evidence.sh "$REVIEWED_SHA"
          evidence_digest="$(printf '%s' "$comment_body" | sha256sum | awk '{print $1}')"
          # EVIDENCE_DIGEST is a validated output passed through the job env.
          # shellcheck disable=SC2153
          if [[ "$evidence_digest" != "$EVIDENCE_DIGEST" ]]; then
            echo "the strictly validated review-evidence record changed while tests were running" >&2
            exit 1
          fi
          metadata_digest="$(printf '%s\0%s' "$pr_title" "$pr_body" | sha256sum | awk '{print $1}')"
          echo "metadata_digest=$metadata_digest" >> "$GITHUB_OUTPUT"

      - name: Mint a repository-scoped review-gate token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.TACTUS_FRONTIER_APP_CLIENT_ID }}
          private-key: ${{ secrets.TACTUS_FRONTIER_APP_PRIVATE_KEY }}
          permission-checks: write
      - name: Publish and verify the exact-head App check
        shell: bash
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          REPOSITORY_TOKEN: ${{ github.token }}
          EXPECTED_APP_ID: ${{ vars.TACTUS_FRONTIER_APP_ID }}
          METADATA_DIGEST: ${{ steps.live-metadata.outputs.metadata_digest }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          if [[ ! "$EXPECTED_APP_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo "TACTUS_FRONTIER_APP_ID must be a positive integer" >&2
            exit 1
          fi

          check_payload="$(bash .github/scripts/frontier-check-payload.sh \
            "$ATTESTED_SHA" "$REVIEWED_SHA" "$PR_NUMBER" "$REVIEW_URL" "$EVIDENCE_DIGEST")"
          check_run="$(GH_TOKEN="$APP_TOKEN" gh api --method POST "repos/$GITHUB_REPOSITORY/check-runs" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            --input - <<< "$check_payload")"

          actual_name="$(jq -r '.name' <<< "$check_run")"
          actual_sha="$(jq -r '.head_sha' <<< "$check_run")"
          actual_status="$(jq -r '.status' <<< "$check_run")"
          actual_conclusion="$(jq -r '.conclusion' <<< "$check_run")"
          actual_app_id="$(jq -r '.app.id | tostring' <<< "$check_run")"
          actual_external_id="$(jq -r '.external_id' <<< "$check_run")"
          expected_external_id="tactus-frontier-review:pr-$PR_NUMBER:$ATTESTED_SHA:$EVIDENCE_DIGEST"
          if [[ "$ATTESTED_SHA" != "$REVIEWED_SHA" ]]; then
            expected_external_id+=":reviewed:$REVIEWED_SHA"
          fi

          if [[ "$actual_name" != "tactus-frontier-review" ||
                "$actual_sha" != "$ATTESTED_SHA" ||
                "$actual_status" != "completed" ||
                "$actual_conclusion" != "success" ||
                "$actual_app_id" != "$EXPECTED_APP_ID" ||
                "$actual_external_id" != "$expected_external_id" ]]; then
            echo "GitHub returned a check run that does not match the signed review record" >&2
            jq '{name, head_sha, status, conclusion, external_id, app_id: .app.id}' <<< "$check_run" >&2
            exit 1
          fi

          jq '{id, name, head_sha, status, conclusion, external_id, app_id: .app.id, details_url}' <<< "$check_run"

          # Close the final fetch-to-POST race. A pull_request_target event also
          # revokes post-sign edits, but an edit which overlaps this API call
          # must fail the check before this signer job can report success.
          latest_pr="$(GH_TOKEN="$REPOSITORY_TOKEN" gh api \
            "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")"
          latest_state="$(jq -r '.state' <<< "$latest_pr")"
          latest_head="$(jq -r '.head.sha' <<< "$latest_pr")"
          latest_base="$(jq -r '.base.ref' <<< "$latest_pr")"
          latest_title="$(jq -r '.title' <<< "$latest_pr")"
          latest_body="$(jq -r '.body // ""' <<< "$latest_pr" | tr -d '\r')"
          latest_metadata_digest="$(printf '%s\0%s' "$latest_title" "$latest_body" | sha256sum | awk '{print $1}')"
          if [[ "$latest_state" != "open" ||
                "$latest_head" != "$ATTESTED_SHA" ||
                "$latest_base" != "$DEFAULT_BRANCH" ||
                "$latest_metadata_digest" != "$METADATA_DIGEST" ]]; then
            GH_TOKEN="$APP_TOKEN" bash .github/scripts/invalidate-frontier-check.sh \
              "$ATTESTED_SHA" "$PR_NUMBER" "$EXPECTED_APP_ID"
            echo "pull-request identity or metadata changed while the App check was being published" >&2
            exit 1
          fi
