name: Release

# Tag-driven, like a NuGet release: `git tag v0.1.0 && git push origin v0.1.0`.
# Nothing publishes on an ordinary push.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # Refuse early if the tag and Cargo.toml disagree — a crates.io version
  # number can never be reused, so publishing the wrong one is unrecoverable.
  verify:
    name: Release / verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Require a commit from protected mainline
        shell: bash
        run: |
          git fetch --no-tags origin master:refs/remotes/origin/master
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "release tag must point to a commit reachable from master" >&2
            exit 1
          fi

      - id: check
        name: Match tag to manifest version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "$tag" != "$manifest" ]; then
            echo "tag v$tag does not match Cargo.toml version $manifest" >&2
            exit 1
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings

  # Never ship a tag that does not pass its own gates.
  test:
    name: Release / test (${{ matrix.os }})
    needs: verify
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: |
          git config --global user.email "ci@upstroke.local"
          git config --global user.name "upstroke CI"
      - run: cargo test --all-targets

  binaries:
    name: Release / binary (${{ matrix.target }})
    needs: test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: upstroke-x86_64-pc-windows-msvc.zip
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: upstroke-x86_64-unknown-linux-gnu.tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: upstroke-aarch64-apple-darwin.tar.gz
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo build --release --target ${{ matrix.target }}

      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          tar -czf "${{ matrix.archive }}" -C "target/${{ matrix.target }}/release" upstroke
      - name: Package (windows)
        if: runner.os == 'Windows'
        run: |
          Compress-Archive -Path "target/${{ matrix.target }}/release/upstroke.exe" -DestinationPath "${{ matrix.archive }}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}

  github-release:
    name: Release / GitHub
    needs: binaries
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      attestations: read
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - id: existing-release
        name: Reuse only a complete immutable release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          IMMUTABLE_RELEASES_REQUIRED: ${{ vars.UPSTROKE_IMMUTABLE_RELEASES_REQUIRED }}
        run: |
          set -euo pipefail

          # The endpoint that exposes this live setting requires repository
          # Administration(read), which GITHUB_TOKEN cannot request. Bootstrap
          # reads the setting back with the owner token and sets this assertion.
          # Keep the post-publication immutable attestation check below as the
          # authoritative fail-closed control.
          if [[ "$IMMUTABLE_RELEASES_REQUIRED" != "true" ]]; then
            echo "repository bootstrap has not asserted immutable releases" >&2
            exit 1
          fi

          # Get-by-tag omits drafts. Enumerate every page and remove all
          # unpublished same-tag attempts before considering a published
          # release, so non-overwrite mode can never retain partial old assets.
          release_pages="$(gh api --paginate --slurp \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/$GITHUB_REPOSITORY/releases?per_page=100")"
          draft_ids="$(printf '%s' "$release_pages" | \
            bash .github/scripts/release-draft-ids.sh "$GITHUB_REF_NAME")"
          while IFS= read -r draft_id; do
            if [[ -z "$draft_id" ]]; then
              continue
            fi
            gh api --method DELETE -H 'X-GitHub-Api-Version: 2026-03-10' \
              "repos/$GITHUB_REPOSITORY/releases/$draft_id"
          done <<< "$draft_ids"

          error_file="$RUNNER_TEMP/release-lookup-error.txt"
          if release="$(gh api -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" 2>"$error_file")"; then
            if ! printf '%s' "$release" | \
              bash .github/scripts/validate-release-record.sh "$GITHUB_REF_NAME"; then
              echo "existing release is mutable, incomplete, or does not match $GITHUB_REF_NAME" >&2
              echo "published release assets are never repaired or overwritten in place" >&2
              exit 1
            fi

            echo "complete immutable release already exists; preserving every asset"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          elif grep -Fq "HTTP 404" "$error_file"; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            cat "$error_file" >&2
            exit 1
          fi

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: steps.existing-release.outputs.publish == 'true'
        with:
          merge-multiple: true
      - if: steps.existing-release.outputs.publish == 'true'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            upstroke-aarch64-apple-darwin.tar.gz
            upstroke-x86_64-pc-windows-msvc.zip
            upstroke-x86_64-unknown-linux-gnu.tar.gz
          overwrite_files: false
          fail_on_unmatched_files: true
          generate_release_notes: true

      - name: Require immutable release and complete attested assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Check the REST record before any attestation command can exit. If
          # repository immutability drifted off, remove the unsafe publication
          # while it is still mutable and before crates.io can run.
          release="$(gh api -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME")"
          if ! printf '%s' "$release" | \
            bash .github/scripts/validate-release-record.sh "$GITHUB_REF_NAME"; then
            if [[ "$(jq -r '.immutable' <<< "$release")" != "true" ]]; then
              release_id="$(jq -r '.id' <<< "$release")"
              if gh api --method DELETE -H 'X-GitHub-Api-Version: 2026-03-10' \
                "repos/$GITHUB_REPOSITORY/releases/$release_id"; then
                echo "removed unsafe mutable release; enable repository release immutability and retry" >&2
              else
                echo "failed to remove unsafe mutable release; remove it manually before retrying" >&2
              fi
            else
              echo "immutable release exists but its asset set is incomplete; manual investigation required" >&2
            fi
            exit 1
          fi

          # Verify GitHub's signed release record on both first publication and
          # reruns. Downloading the frozen assets and hashing them against that
          # record proves the bytes consumers receive match the attestation.
          gh release verify "$GITHUB_REF_NAME"
          verified_dir="$RUNNER_TEMP/verified-release-assets"
          mkdir -p "$verified_dir"
          gh release download "$GITHUB_REF_NAME" --dir "$verified_dir"
          for asset in \
            upstroke-aarch64-apple-darwin.tar.gz \
            upstroke-x86_64-pc-windows-msvc.zip \
            upstroke-x86_64-unknown-linux-gnu.tar.gz; do
            gh release verify-asset "$GITHUB_REF_NAME" "$verified_dir/$asset"
            if [[ "${{ steps.existing-release.outputs.publish }}" == "true" ]]; then
              gh release verify-asset "$GITHUB_REF_NAME" "$asset"
            fi
          done

  crates-io:
    name: Release / crates.io
    needs: github-release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Required by crates.io Trusted Publishing: the job mints a short-lived
    # OIDC token instead of holding a long-lived API key. Configure the repo
    # and workflow as a trusted publisher in the crates.io settings first.
    permissions:
      contents: read
      id-token: write
    environment: crates-io
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Authenticate to crates.io
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth

      - run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          # Fallback if you use a classic API token instead of Trusted
          # Publishing: drop the auth step above and set this from a secret —
          # CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
