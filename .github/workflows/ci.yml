name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is the first-class target (DESIGN.md §1), so it is not an
        # afterthought here: the subprocess supervisor, the cmd /C quoting and
        # the PATHEXT resolution all behave differently per platform and are
        # covered by tests.
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # The engine shells out to git and asserts on its output; runners have
      # git but no identity, and several tests commit.
      - name: Configure git identity
        run: |
          git config --global user.email "ci@tactus.local"
          git config --global user.name "tactus CI"

      # Serial on purpose, and it is a workaround rather than a fix — recorded
      # so the next person knows which it is. Linux CI was red from 75af362 to
      # 12ed1bf with a *different* test failing each run (6059461 lost one,
      # f6e8c47 lost four), which is tests racing each other rather than a
      # broken assertion; Windows hid it by scheduling differently. Serialising
      # turned all three platforms green with no test or engine change, which
      # is the confirmation.
      #
      # The cost is a slower suite and a hiding place for the next such race,
      # so this should not survive.
      #
      # Reproduced in a Linux container (rust:1, 8 cores): 2 of 4 parallel runs
      # failed, a different test each time, always with `RunLock::acquire`
      # reporting the run as already driven. Two findings from that, and only
      # the first is fixed:
      #
      #  1. `acquire` mapped EVERY `try_lock` error to "another process holds
      #     it", including `Interrupted` — and `flock` is interruptible, which
      #     a run spawning git and agent subprocesses does constantly. Fixed;
      #     a spurious refusal was reachable in production, not just in tests.
      #  2. It did NOT fix the race: 3 of 8 runs still fail. With EINTR now
      #     retried, those are genuine `WouldBlock`, i.e. a lock still held
      #     after the run that took it returned. A `/proc/self/fd` dump at the
      #     failure showed several run.lock descriptors open at once. Whether
      #     those are concurrent tests legitimately holding their own locks or
      #     a leak is the open question, and it is where the next attempt
      #     should start.
      #
      # `no_pools()` also writes one shared /tmp/…/pools.toml that every engine
      # test rewrites while others read it — real, unrelated to the lock, and
      # worth fixing regardless.
      - run: cargo test --all-targets -- --test-threads=1

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
