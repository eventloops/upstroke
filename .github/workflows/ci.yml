name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Windows is the first-class target (DESIGN.md §1), so it is not an
        # afterthought here: the subprocess supervisor, the cmd /C quoting and
        # the PATHEXT resolution all behave differently per platform and are
        # covered by tests.
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # The engine shells out to git and asserts on its output; runners have
      # git but no identity, and several tests commit.
      - name: Configure git identity
        run: |
          git config --global user.email "ci@tactus.local"
          git config --global user.name "tactus CI"

      - run: cargo test --all-targets

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings

  # Branch protection requires this one deliberately stable context. Keeping
  # the external rule pointed at an aggregate means adding a platform or
  # splitting a gate cannot silently leave GitHub protecting yesterday's job
  # names. `always()` makes a failed or cancelled dependency produce a failed
  # aggregate instead of a missing required check that never settles.
  merge-gate:
    name: tactus-ci
    if: always()
    needs: [lint, test]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every gate
        shell: bash
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          failed=0
          for gate in LINT TEST; do
            result_var="${gate}_RESULT"
            result="${!result_var}"
            if [[ "$result" != "success" ]]; then
              echo "$gate did not succeed: $result" >&2
              failed=1
            fi
          done
          exit "$failed"
