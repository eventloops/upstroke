name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is the first-class target (DESIGN.md §1), so it is not an
        # afterthought here: the subprocess supervisor, the cmd /C quoting and
        # the PATHEXT resolution all behave differently per platform and are
        # covered by tests.
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # The engine shells out to git and asserts on its output; runners have
      # git but no identity, and several tests commit.
      - name: Configure git identity
        run: |
          git config --global user.email "ci@tactus.local"
          git config --global user.name "tactus CI"

      # Serial on purpose, and it is a workaround rather than a fix — recorded
      # so the next person knows which it is. Linux CI was red from 75af362 to
      # 12ed1bf with a *different* test failing each run (6059461 lost one,
      # f6e8c47 lost four), which is tests racing each other rather than a
      # broken assertion; Windows hid it by scheduling differently. Serialising
      # turned all three platforms green with no test or engine change, which
      # is the confirmation.
      #
      # The cost is a slower suite and a hiding place for the next such race,
      # so this should not survive. The real fix is to stop the tests sharing
      # process-wide state; one confirmed instance is `no_pools()`, which
      # rewrites a single `/tmp/tactus-engine-nopools-<pid>/pools.toml` that
      # every engine test truncates while others read it. That was not proven
      # to be the culprit, and finding the culprit needs a Linux reproduction
      # rather than more inference from a Windows box.
      - run: cargo test --all-targets -- --test-threads=1

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
