name: Invalidate frontier review after PR metadata edit

on:
  # pull_request_target loads this workflow and every script it executes from
  # the trusted default branch. This job never checks out or executes PR code;
  # it uses only the event's validated number/head identity to revoke an
  # existing dedicated-App check after a title/body edit.
  pull_request_target:
    branches: [master]
    types: [edited]

permissions:
  contents: read

concurrency:
  # Do not share the attestation run's group: an owner dispatch must never be
  # able to cancel a pending metadata invalidation. Repeated edits serialize.
  group: frontier-review-invalidate-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  invalidate:
    name: fail App check after title/body edit
    if: github.event.changes.title != null || github.event.changes.body != null
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: frontier-check-signer
    permissions:
      contents: read
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      BASE_REF: ${{ github.event.pull_request.base.ref }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      # For pull_request_target, github.sha belongs to the base branch. Pin it
      # explicitly so no candidate-controlled workflow or helper is loaded.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate trusted metadata-edit event
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "pull-request number must be a positive integer" >&2
            exit 1
          fi
          if [[ ! "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "head SHA must be a full lowercase commit id" >&2
            exit 1
          fi
          if [[ "$BASE_REF" != "$DEFAULT_BRANCH" || "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]]; then
            echo "metadata invalidation must execute from the default-branch target" >&2
            exit 1
          fi
      - name: Mint the review-gate App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.TACTUS_FRONTIER_APP_CLIENT_ID }}
          private-key: ${{ secrets.TACTUS_FRONTIER_APP_PRIVATE_KEY }}
          permission-checks: write
      - name: Invalidate the existing App-owned context
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          EXPECTED_APP_ID: ${{ vars.TACTUS_FRONTIER_APP_ID }}
        run: |
          bash .github/scripts/invalidate-frontier-check.sh \
            "$HEAD_SHA" "$PR_NUMBER" "$EXPECTED_APP_ID"
