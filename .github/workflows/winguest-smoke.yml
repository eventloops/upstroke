# Proof-of-concept for the self-hosted Windows leg: the real checkout and the
# real test command, on an ephemeral winguest-ci runner. Triggered by a draft PR from
# this scratch branch only (dispatch needs the file on master); never merged. The measurement is this job's wall
# clock against the windows-latest baseline (median ~12.5 min, tail ~21 min).
name: winguest smoke

on:
  pull_request:
    branches: [master]

jobs:
  test-winguest:
    name: test (winguest)
    runs-on: [self-hosted, windows, winguest]
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Configure git identity
        run: |
          git config --global user.email "ci@upstroke.local"
          git config --global user.name "upstroke CI"

      - run: cargo test --all-targets --all-features
