[package]
name = "upstroke"
# 0.1.0 because §21's definition of done was actually met, on 2026-08-10: a
# five-task plan ran unattended against a scratch repository through every one
# of its five criteria and the kill/resume test — the acceptance write-up, kept
# in the repository history, is the evidence, including the three engine defects
# that run found. 0.0.1 was the
# crates.io name reservation and never claimed to be more.
#
# The 0.1.0 published to crates.io says "on a real repository" here, which is
# wrong: the acceptance run was against a scratch repo, and the real published
# library came after it. Package metadata is immutable once published, so that
# copy stays wrong and this one is right from the next release on.
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
description = "Headless orchestration engine for AI coding agents — the conductor, not an instrument"
repository = "https://github.com/eventloops/upstroke"
readme = "README.md"
keywords = ["ai", "agents", "orchestration", "automation", "cli"]
categories = ["command-line-utilities", "development-tools"]
# Exclude working records, automation, and the Pages entry point and domain.
# Module notes under docs/internals stay in the crate with the source they
# document. Parser fixtures stay because the tests read them.
exclude = [
    "reviews/",
    ".github/",
    ".upstroke/",
    ".testagent/",
    "acceptance/",
    "docs/index.html",
    "docs/CNAME",
    "scripts/",
]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
# 0.4.20 raised its MSRV to Rust 1.88; keep the public Rust 1.85 contract.
globset = "=0.4.19"
pulldown-cmark = { version = "0.13", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
toml = "0.8"

# TEST-ONLY, and the shipped library carries no YAML parser: the CI workflow-shape
# oracle in `src/effects/tests.rs` reads `.github/workflows/ci.yml` as a document
# rather than as text. `BRIDGE-CI-SHAPE-TEST-IS-A-SUBSTRING-ORACLE` in
# `reviews/FINDINGS.md` specifies the parse and names the two properties this
# dependency is chosen for; both are asserted by execution in
# `the_workflow_parser_rejects_duplicate_keys_and_reads_on_as_a_string`, so a
# silent change in either fails a test rather than weakening an oracle:
#
#   * **duplicate-key rejection.** A second `runs-on:` in a job must be an error,
#     not a silent last-one-wins overwrite -- otherwise every structural equality
#     below reads the winner and a mutation hides in the loser. Measured on
#     2026-08-29 against the three candidates: `yaml-rust2` 0.12.0 refuses
#     (`duplicated key in mapping`), `serde_yaml_ng` 0.10.0 refuses,
#     **`saphyr` 0.0.12 accepts and overwrites** -- which is why the nearest
#     alternative is not this one.
#   * **YAML 1.2.** A workflow's `on:` key is `true` under YAML 1.1's bool
#     resolution; a 1.2 parser reads it as the string it is.
#
# `default-features = false` drops `encoding_rs`: the workflow is read through
# `fs::read_to_string`, so the decoder that feature adds has nothing to decode.
# The version is pinned exactly, for `globset`'s reason a few lines above and
# more sharply: 0.11.1 declared MSRV 1.65 and 0.12.0 declares **1.85.0**, this
# crate's floor exactly, so the next minor is free to leave the contract.
[dev-dependencies]
yaml-rust2 = { version = "=0.12.0", default-features = false }

# `fcntl(F_SETLK)` for the run lock, which std does not expose — std's
# `File::try_lock` is `flock`, and `flock` is inherited across `fork`. See
# `src/rundir.rs` for why that difference decides the whole design of the lock.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Windows uses Job Objects for process-tree ownership and calls LockFileEx
# directly because Rust 1.85 predates std's file-locking API.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

# Lint levels are repository policy and change only here (CODING_STANDARDS.md
# §2). Each entry landed with the tree already clean under it; the named output
# modules and the documented §7 invariant sites carry `#[expect]` with reasons,
# and `clippy.toml` holds the test allowances.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"

# §5: an overflow nobody chose fails loudly in release builds instead of
# wrapping. The panic strategy stays `unwind` in every profile — §6's cleanup
# guarantees depend on RAII running during unwinding (CODING_STANDARDS.md §7).
[profile.release]
overflow-checks = true
