[package]
name = "tactus"
# 0.0.x while the v0.1 milestone (DESIGN.md §21) is still being built — 0.1.0
# is reserved for the release that actually meets its definition of done.
version = "0.0.1"
edition = "2024"
license = "AGPL-3.0-only"
description = "Headless orchestration engine for AI coding agents — the conductor, not an instrument"
repository = "https://github.com/keybindings/tactus"
readme = "README.md"
keywords = ["ai", "agents", "orchestration", "automation", "cli"]
categories = ["command-line-utilities", "development-tools"]
# Internal working documents: useful in the repo, noise in the published
# crate. Fixtures stay — the parser tests are fixture-driven.
exclude = ["reviews/", ".github/", ".tactus/", "acceptance/"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
globset = "0.4"
pulldown-cmark = { version = "0.13", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.8"
